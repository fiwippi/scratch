{{range $id := .}}
<div id="img-{{$id}}">
<img
  src="/images/{{$id}}"
  style="max-width: 700px"
  onclick="document.getElementById('img-dialog-{{$id}}').showModal();" />
<dialog
  closedby="any"
  id="img-dialog-{{$id}}"
  hx-swap="innerHTML"
  hx-get="/frag/images/{{$id}}/dialog"
  hx-trigger="intersect once">
</dialog>
</div>
{{end}}
